# Project metadata and build configuration for WebScrape.
# We use the standard PEP 621 [project] table so any modern Python tool
# (pip, build, uv, poetry) can read it without extra configuration.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webscrape"
version = "0.1.0"
description = "Free and open-source passive internet service discovery and CVE lookup tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

# Runtime dependencies are intentionally minimal and well-maintained.
# - httpx: modern HTTP client used for the NVD API calls (CVE lookup).
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Development and test dependencies, installed with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
# Only package the application code under webscrape/; tests stay out of the wheel.
include = ["webscrape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
